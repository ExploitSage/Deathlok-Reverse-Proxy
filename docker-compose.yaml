services:

  reverseproxy:
    image: 'nginx:alpine'
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - letsencrypt-certs:/etc/letsencrypt
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - reverseproxy
    depends_on:
      porkbot:
        condition: service_completed_successfully
      amalgamationstarfleet:
        condition: service_started
      michelfamily:
        condition: service_started

  porkbot:
    image: 'infinityofspace/certbot_dns_porkbun:latest'
    command:
      - "renew"
    volumes:
      - letsencrypt-certs:/etc/letsencrypt
      - letsencrypt-logs:/var/log/letsencrypt
      - ./.porkbun.ini:/conf/porkbun.ini

  amalgamationstarfleet:
    image: 'nginx:alpine'
    restart: unless-stopped
    expose:
      - '80'
    volumes:
      - ./Amalgamation-Starfleet:/usr/share/nginx/html
    networks:
      - reverseproxy

  michelfamily:
    image: 'nginx:alpine'
    restart: unless-stopped
    expose:
      - '80'
    volumes:
      - ./Michel-Family:/usr/share/nginx/html
    networks:
      - reverseproxy

networks:
  reverseproxy:
    driver: bridge

volumes:
  letsencrypt-certs:
  letsencrypt-logs:

